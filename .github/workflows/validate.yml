name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON and Python
        run: |
          for document in configs/*.json evidence/*.json; do
            python -m json.tool "$document" >/dev/null
          done
          python -m py_compile scripts/*.py
          bash -n scripts/*.sh
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for document in Path('manifests').rglob('*.xml'):
              ET.parse(document)
          dsu = __import__('json').loads(Path('configs/yaap16-dsu-upper5.json').read_text())
          assert dsu['schema'] == 1
          assert [item['name'] for item in dsu['partitions']] == [
              'system', 'system_ext', 'product', 'vendor', 'odm'
          ]
          assert all(item['expected_size'] > 0 for item in dsu['partitions'])
          assert all(len(item['expected_sha256']) == 64 for item in dsu['partitions'])
          PY
          python scripts/Build-BaselineManifest.py \
            --config configs/baselines.json \
            --config-only
      - name: Reject accidentally committed large artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          limit = 5 * 1024 * 1024
          large = [str(p) for p in Path('.').rglob('*') if p.is_file() and '.git' not in p.parts and p.stat().st_size > limit]
          if large:
              raise SystemExit('Large tracked files: ' + ', '.join(large))
          PY
      - name: Validate haotian patches against pinned source
        run: |
          git clone --depth 50 --branch lineage-23.2 \
            https://github.com/rep1ace/device_xiaomi_haotian.git /tmp/device_xiaomi_haotian
          git -C /tmp/device_xiaomi_haotian checkout 483ace84ff3f8ef9cf0438626ce221022d23f433
          git -C /tmp/device_xiaomi_haotian apply --check \
            "$GITHUB_WORKSPACE/patches/0001-haotian-cs40l26-calibration-loader.patch"
          git -C /tmp/device_xiaomi_haotian apply --check \
            "$GITHUB_WORKSPACE/patches/0002-haotian-disable-adb-insecure.patch"
      - name: Validate sm8750-common patch against pinned source
        run: |
          git clone --depth 50 --branch lineage-23.2 \
            https://github.com/rep1ace/device_xiaomi_sm8750-common.git /tmp/device_xiaomi_sm8750-common
          git -C /tmp/device_xiaomi_sm8750-common checkout 6f633ec0919fdfe3f8d307e8ab7770c1c1a90696
          git -C /tmp/device_xiaomi_sm8750-common apply --check \
            "$GITHUB_WORKSPACE/patches/0003-sm8750-production-avb-profile.patch"
          git -C /tmp/device_xiaomi_sm8750-common apply --check \
            "$GITHUB_WORKSPACE/patches/0004-sm8750-3.0.304-soterservice-source.patch"

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            $errors += $parseErrors
          }
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }
