name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON and Python
        run: |
          python -m json.tool configs/baselines.json >/dev/null
          python -m json.tool evidence/known-artifacts.json >/dev/null
          python -m py_compile scripts/*.py
          python scripts/Build-BaselineManifest.py \
            --config configs/baselines.json \
            --config-only
      - name: Reject accidentally committed large artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          limit = 5 * 1024 * 1024
          large = [str(p) for p in Path('.').rglob('*') if p.is_file() and '.git' not in p.parts and p.stat().st_size > limit]
          if large:
              raise SystemExit('Large tracked files: ' + ', '.join(large))
          PY
      - name: Validate CS40L26 patch against pinned source
        run: |
          git clone --depth 50 --branch lineage-23.2 \
            https://github.com/rep1ace/device_xiaomi_haotian.git /tmp/device_xiaomi_haotian
          git -C /tmp/device_xiaomi_haotian checkout 483ace84ff3f8ef9cf0438626ce221022d23f433
          git -C /tmp/device_xiaomi_haotian apply --check \
            "$GITHUB_WORKSPACE/patches/0001-haotian-cs40l26-calibration-loader.patch"

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            $errors += $parseErrors
          }
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }
